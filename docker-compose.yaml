services:
  api: 
    build: ./api
    env_file: .env
    container_name: "api"
    ports: 
      - 8000:8000
    networks:
      - testing

  postgres:
    image: postgres
    container_name: 'postgres'
    env_file: .env
    volumes:
      - pgdata:/var/data/postgreql
    expose:
      - $POSTGRES_PORT
    networks:
      - testing

  minio:
    image: quay.io/minio/minio
    container_name: "minio"
    env_file: .env
    volumes:
      - minio:/data
    command: server /data --console-address ":9001"
    networks:
      - testing

  redis:
    image: redis:latest
    container_name: "redis"
    ports:
      - $REDIS_PORT:$REDIS_PORT
    volumes:
      - redis:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - testing

volumes:
  pgdata:
  minio:
  redis:

networks:
  testing:
    external: true
